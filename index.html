<script type="module">
import * as THREE from 'three/webgpu';
import * as TSL from 'three/tsl';
import { bloom } from 'three/addons/tsl/display/BloomNode.js';
import * as BufferGeometryUtils from 'three/addons/utils/BufferGeometryUtils.js';

// ============================================================================
// CONFIG: tuning constants shared by every system.
// ============================================================================
const CONFIG = Object.freeze({
  VERSION: '1.0.0',
  CHUNK_SIZE: 256,
  LOD_RESOLUTIONS: Object.freeze([64, 32, 16, 8]),
  LOD_RING_LIMITS: Object.freeze([1, 3, 6]),
  SKIRT_DEPTH: 36,
  WATER_LEVEL: 0,
  LANDMARK_CELL: 2400,
  VEGETATION_RINGS: 3,
  GROUND_CLEARANCE: 4,
  WATER_CLEARANCE: 2.5,
  MAX_ALTITUDE: 2600,
  SPEED: Object.freeze({ MIN: 24, STALL: 32, CRUISE: 62, MAX: 135, BOOST_MAX: 170 }),
  DAY_LENGTH_DEFAULT: 360,
  START_SUN_ELEVATION_DEG: 9,
  SUN_MAX_ELEVATION_DEG: 62,
  CLOUD_SHADOW: Object.freeze({ SIZE: 128, WORLD: 4096 }),
  CAMERA: Object.freeze({ FOV_BASE: 60, FOV_MAX: 78, NEAR: 1 }),
  REMOTE_COPILOT_DEFAULT_ENDPOINT: 'http://localhost:3000/copilot',
  REMOTE_COPILOT_TIMEOUT_MS: 800,
  UI_IDLE_HIDE_MS: 3000,
  QUALITY_LEVELS: Object.freeze([
    Object.freeze({ name: 'minimal', viewRings: 5, pixelRatio: 0.75, shadowMapSize: 1024, vegetationRings: 1, vegetationDensity: 0.45, cloudDensity: 0.5, birdDensity: 0.5, bloom: false }),
    Object.freeze({ name: 'low', viewRings: 6, pixelRatio: 1.0, shadowMapSize: 1024, vegetationRings: 2, vegetationDensity: 0.65, cloudDensity: 0.7, birdDensity: 0.7, bloom: true }),
    Object.freeze({ name: 'medium', viewRings: 8, pixelRatio: 1.25, shadowMapSize: 2048, vegetationRings: 2, vegetationDensity: 0.85, cloudDensity: 0.85, birdDensity: 1, bloom: true }),
    Object.freeze({ name: 'high', viewRings: 10, pixelRatio: 1.5, shadowMapSize: 2048, vegetationRings: 3, vegetationDensity: 1, cloudDensity: 1, birdDensity: 1, bloom: true }),
    Object.freeze({ name: 'ultra', viewRings: 12, pixelRatio: 2, shadowMapSize: 4096, vegetationRings: 3, vegetationDensity: 1, cloudDensity: 1, birdDensity: 1, bloom: true }),
  ]),
});

const WORLD_OPTIONS = Object.freeze({
  chunkSize: CONFIG.CHUNK_SIZE,
  lod0Resolution: CONFIG.LOD_RESOLUTIONS[0],
  waterLevel: CONFIG.WATER_LEVEL,
  landmarkCell: CONFIG.LANDMARK_CELL,
});

// ============================================================================
// WORLD GENERATION: pure and deterministic from the seed.
// createWorldGen is serialized with Function.prototype.toString() into the
// terrain Web Worker, so it must never reference anything outside its body.
// Units are metres. Axes: +x east, -z north, +y up.
// ============================================================================
function createWorldGen(seedString, options) {
  const CHUNK_SIZE = options.chunkSize;
  const GRID_STEP = options.chunkSize / options.lod0Resolution;
  const WATER_LEVEL = options.waterLevel;
  const LANDMARK_CELL = options.landmarkCell;

  const BIOMES = [
    { index: 0, key: 'snow', name: 'Snow Peaks', temperature: 0.12, moisture: 0.55 },
    { index: 1, key: 'pine', name: 'Pine Valleys', temperature: 0.36, moisture: 0.78 },
    { index: 2, key: 'dunes', name: 'Dune Sea', temperature: 0.86, moisture: 0.14 },
    { index: 3, key: 'archipelago', name: 'Archipelago', temperature: 0.72, moisture: 0.86 },
    { index: 4, key: 'meadows', name: 'Flower Meadows', temperature: 0.56, moisture: 0.42 },
  ];
  const BIOME_SIGMA_SQ2 = 2 * 0.13 * 0.13;

  // Six-colour palette per biome (sRGB hex); converted to linear below.
  const PALETTES_SRGB = [
    [0x4a4e5c, 0x6b6f7d, 0x8d8b92, 0xc9d6e8, 0xf2f5fa, 0xa9cde0], // snow: rock dark, rock, scree, snow shade, snow, ice
    [0x3f5a36, 0x5b7a3f, 0x7f9a4e, 0x6b5a3e, 0x7a7466, 0xe8edf2], // pine: grass dark, grass, moss, needle floor, rock, snow cap
    [0xe9c98f, 0xd9a866, 0xc08850, 0xa8583a, 0x8c8a4e, 0xefe2c4], // dunes: sand light, sand warm, lee shadow, mesa red, scrub, salt flat
    [0x2e6f7a, 0x7fc6b8, 0xf0dcae, 0x3f7a45, 0x6fa04a, 0x857a6a], // archipelago: seabed, reef sand, beach, jungle, palm light, cliff
    [0x8fb45a, 0xa7b85e, 0x9a7b52, 0xe58fa6, 0xf2c94c, 0xa58fd8], // meadows: grass, warm grass, soil, pink, gold, lavender
  ];
  const VEGETATION = { PINE: 0, BROADLEAF: 1, PALM: 2, ROCK: 3, CACTUS: 4, FLOWERS: 5 };
  const LANDMARK_TYPES = ['arch', 'monoliths', 'lighthouse', 'balloons'];
  const DUNE_WIND_ANGLE = 0.55;
  const DUNE_COS = Math.cos(DUNE_WIND_ANGLE);
  const DUNE_SIN = Math.sin(DUNE_WIND_ANGLE);

  function clamp01(value) { return value < 0 ? 0 : value > 1 ? 1 : value; }
  function smoothstep(edge0, edge1, value) {
    const t = clamp01((value - edge0) / (edge1 - edge0));
    return t * t * (3 - 2 * t);
  }
  function srgbToLinear(channel) {
    return channel < 0.04045 ? channel * 0.0773993808 : Math.pow(channel * 0.9478672986 + 0.0521327014, 2.4);
  }
  function hexToLinear(hex, out, offset) {
    out[offset] = srgbToLinear(((hex >> 16) & 255) / 255);
    out[offset + 1] = srgbToLinear(((hex >> 8) & 255) / 255);
    out[offset + 2] = srgbToLinear((hex & 255) / 255);
  }
  function hashString(text) {
    let hash = 2166136261 >>> 0;
    for (let index = 0; index < text.length; index++) {
      hash ^= text.charCodeAt(index);
      hash = Math.imul(hash, 16777619);
    }
    return mix32(hash >>> 0);
  }
  function mix32(value) {
    let h = value | 0;
    h = Math.imul(h ^ (h >>> 16), 0x85ebca6b);
    h = Math.imul(h ^ (h >>> 13), 0xc2b2ae35);
    return (h ^ (h >>> 16)) >>> 0;
  }
  function mulberry32(state) {
    let a = state | 0;
    return function next() {
      a = (a + 0x6d2b79f5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  const seedHash = hashString(String(seedString).toUpperCase());
  const random = mulberry32(seedHash);

  /** Deterministic hash of an integer lattice point to [0, 1). */
  function hash2(ix, iz, salt) {
    let h = mix32((seedHash ^ Math.imul(salt | 0, 0x9e3779b1)) >>> 0);
    h = mix32((h ^ (ix | 0)) >>> 0);
    h = mix32((h + Math.imul(iz | 0, 0x27d4eb2d)) >>> 0);
    return h / 4294967296;
  }

  // ---- Seeded 2D simplex noise (Gustavson), output roughly [-1, 1] -----------
  const perm = new Uint8Array(512);
  const permMod8 = new Uint8Array(512);
  {
    const table = new Uint8Array(256);
    for (let index = 0; index < 256; index++) table[index] = index;
    for (let index = 255; index > 0; index--) {
      const swapIndex = Math.floor(random() * (index + 1));
      const held = table[index];
      table[index] = table[swapIndex];
      table[swapIndex] = held;
    }
    for (let index = 0; index < 512; index++) {
      perm[index] = table[index & 255];
      permMod8[index] = perm[index] & 7;
    }
  }
  const GRAD_X = new Float64Array([1, -1, 1, -1, 1, -1, 0, 0]);
  const GRAD_Z = new Float64Array([1, 1, -1, -1, 0, 0, 1, -1]);
  const SKEW = 0.5 * (Math.sqrt(3) - 1);
  const UNSKEW = (3 - Math.sqrt(3)) / 6;

  function simplex2(xin, zin) {
    const skew = (xin + zin) * SKEW;
    const i = Math.floor(xin + skew);
    const j = Math.floor(zin + skew);
    const unskew = (i + j) * UNSKEW;
    const x0 = xin - (i - unskew);
    const z0 = zin - (j - unskew);
    const i1 = x0 > z0 ? 1 : 0;
    const j1 = 1 - i1;
    const x1 = x0 - i1 + UNSKEW;
    const z1 = z0 - j1 + UNSKEW;
    const x2 = x0 - 1 + 2 * UNSKEW;
    const z2 = z0 - 1 + 2 * UNSKEW;
    const ii = i & 255;
    const jj = j & 255;
    let total = 0;
    let t0 = 0.5 - x0 * x0 - z0 * z0;
    if (t0 > 0) {
      const g = permMod8[ii + perm[jj]];
      t0 *= t0;
      total += t0 * t0 * (GRAD_X[g] * x0 + GRAD_Z[g] * z0);
    }
    let t1 = 0.5 - x1 * x1 - z1 * z1;
    if (t1 > 0) {
      const g = permMod8[ii + i1 + perm[jj + j1]];
      t1 *= t1;
      total += t1 * t1 * (GRAD_X[g] * x1 + GRAD_Z[g] * z1);
    }
    let t2 = 0.5 - x2 * x2 - z2 * z2;
    if (t2 > 0) {
      const g = permMod8[ii + 1 + perm[jj + 1]];
      t2 *= t2;
      total += t2 * t2 * (GRAD_X[g] * x2 + GRAD_Z[g] * z2);
    }
    return 70 * total;
  }

  const OFFSETS = new Float64Array(96);
  for (let index = 0; index < OFFSETS.length; index++) OFFSETS[index] = (random() - 0.5) * 20000;

  function noise(x, z, frequency, channel) {
    return simplex2(x * frequency + OFFSETS[channel * 2], z * frequency + OFFSETS[channel * 2 + 1]);
  }
  function fbm(x, z, frequency, octaves, channel) {
    let amplitude = 1;
    let sum = 0;
    let norm = 0;
    let freq = frequency;
    const offsetX = OFFSETS[channel * 2];
    const offsetZ = OFFSETS[channel * 2 + 1];
    for (let octave = 0; octave < octaves; octave++) {
      sum += amplitude * simplex2(x * freq + offsetX + octave * 17.31, z * freq + offsetZ - octave * 11.7);
      norm += amplitude;
      amplitude *= 0.5;
      freq *= 2.03;
    }
    return sum / norm;
  }
  function ridged(x, z, frequency, octaves, channel) {
    let amplitude = 1;
    let sum = 0;
    let norm = 0;
    let freq = frequency;
    let weight = 1;
    const offsetX = OFFSETS[channel * 2];
    const offsetZ = OFFSETS[channel * 2 + 1];
    for (let octave = 0; octave < octaves; octave++) {
      let value = 1 - Math.abs(simplex2(x * freq + offsetX + octave * 31.7, z * freq + offsetZ + octave * 7.3));
      value *= value;
      value *= weight;
      weight = clamp01(value * 1.8);
      sum += value * amplitude;
      norm += amplitude;
      amplitude *= 0.5;
      freq *= 2.1;
    }
    return sum / norm;
  }

  // ---- Climate and biome weights ------------------------------------------------
  function climate(x, z, out) {
    const warpX = x + 700 * noise(x, z, 1 / 4200, 0);
    const warpZ = z + 700 * noise(x, z, 1 / 4200, 1);
    const temperature = 0.72 * noise(warpX, warpZ, 1 / 9000, 2) + 0.28 * noise(warpX, warpZ, 1 / 2600, 3);
    const moisture = 0.72 * noise(warpX, warpZ, 1 / 7600, 4) + 0.28 * noise(warpX, warpZ, 1 / 2200, 5);
    out.temperature = clamp01(0.5 + 0.85 * temperature);
    out.moisture = clamp01(0.5 + 0.85 * moisture);
    return out;
  }
  function biomeWeights(temperature, moisture, out) {
    let total = 0;
    for (let index = 0; index < 5; index++) {
      const dt = temperature - BIOMES[index].temperature;
      const dm = moisture - BIOMES[index].moisture;
      const weight = Math.exp(-(dt * dt + dm * dm) / BIOME_SIGMA_SQ2);
      out[index] = weight;
      total += weight;
    }
    if (!(total > 1e-30)) {
      for (let index = 0; index < 5; index++) out[index] = index === 4 ? 1 : 0;
      return out;
    }
    for (let index = 0; index < 5; index++) out[index] /= total;
    return out;
  }

  // ---- Per-biome height functions (metres) --------------------------------------
  function heightSnow(x, z) {
    const ridges = ridged(x, z, 1 / 1900, 5, 6);
    return 140 + 120 * fbm(x, z, 1 / 3000, 2, 7) + 760 * Math.pow(ridges, 1.6) + 18 * fbm(x, z, 1 / 220, 2, 8);
  }
  function heightPine(x, z) {
    const ridges = ridged(x, z, 1 / 1500, 4, 9);
    return 35 + 90 * fbm(x, z, 1 / 2600, 3, 10) + 300 * Math.pow(ridges, 1.8) + 12 * fbm(x, z, 1 / 180, 2, 11);
  }
  function heightDunes(x, z) {
    const base = 28 + 30 * fbm(x, z, 1 / 2400, 3, 12);
    const along = x * DUNE_COS + z * DUNE_SIN;
    const across = -x * DUNE_SIN + z * DUNE_COS;
    const warped = along + 60 * noise(across, along, 1 / 900, 13);
    const phase = warped / 170 - Math.floor(warped / 170);
    const profile = phase < 0.72 ? phase / 0.72 : (1 - phase) / 0.28;
    const duneShape = profile * profile * (3 - 2 * profile);
    const amplitude = 16 * (0.55 + 0.45 * noise(x, z, 1 / 900, 14));
    const mesa = smoothstep(0.32, 0.4, fbm(x, z, 1 / 1700, 3, 15)) * 85;
    return base + duneShape * amplitude + mesa;
  }
  function heightArchipelago(x, z) {
    const island = smoothstep(0.12, 0.48, fbm(x, z, 1 / 1300, 5, 16));
    const detail = fbm(x, z, 1 / 260, 3, 17);
    return -42 + 22 * fbm(x, z, 1 / 3000, 2, 18) + island * (70 + 30 * detail) + (1 - island) * 4 * detail;
  }
  function heightMeadows(x, z) {
    return 26 + 48 * fbm(x, z, 1 / 1100, 4, 19) + 18 * fbm(x, z, 1 / 360, 2, 20) + 30 * Math.max(0, fbm(x, z, 1 / 2400, 2, 21));
  }
  const BIOME_HEIGHT = [heightSnow, heightPine, heightDunes, heightArchipelago, heightMeadows];

  const scratchClimate = { temperature: 0, moisture: 0 };
  const scratchWeights = new Float64Array(5);

  function baseHeight(x, z, climateOut, weightsOut) {
    climate(x, z, climateOut);
    biomeWeights(climateOut.temperature, climateOut.moisture, weightsOut);
    let height = 0;
    let weightSum = 0;
    for (let index = 0; index < 5; index++) {
      const weight = weightsOut[index];
      if (weight < 0.003) continue;
      height += weight * BIOME_HEIGHT[index](x, z);
      weightSum += weight;
    }
    return height / weightSum;
  }

  // ---- Landmark sites: one candidate per LANDMARK_CELL square -------------------
  const siteCache = new Map();
  let lastSiteKey = NaN;
  let lastSite = null;

  function landmarkSiteForCell(cellX, cellZ) {
    const key = (cellX + 32768) * 65536 + (cellZ + 32768);
    if (key === lastSiteKey) return lastSite;
    let site = siteCache.get(key);
    if (site === undefined) {
      site = buildSite(cellX, cellZ);
      if (siteCache.size > 4096) siteCache.clear();
      siteCache.set(key, site);
    }
    lastSiteKey = key;
    lastSite = site;
    return site;
  }

  function buildSite(cellX, cellZ) {
    if (hash2(cellX, cellZ, 101) < 0.12) return null;
    const x = (cellX + 0.2 + 0.6 * hash2(cellX, cellZ, 102)) * LANDMARK_CELL;
    const z = (cellZ + 0.2 + 0.6 * hash2(cellX, cellZ, 103)) * LANDMARK_CELL;
    const siteClimate = { temperature: 0, moisture: 0 };
    const siteWeights = new Float64Array(5);
    const groundHeight = baseHeight(x, z, siteClimate, siteWeights);
    let biome = 0;
    for (let index = 1; index < 5; index++) if (siteWeights[index] > siteWeights[biome]) biome = index;
    const roll = hash2(cellX, cellZ, 104);
    let type;
    if (groundHeight < -8) type = 'lighthouse';
    else if (groundHeight < 2) type = 'balloons';
    else if (biome === 2) type = roll < 0.6 ? 'arch' : roll < 0.82 ? 'monoliths' : 'balloons';
    else if (biome === 0) type = roll < 0.55 ? 'arch' : roll < 0.85 ? 'monoliths' : 'balloons';
    else if (biome === 1) type = roll < 0.35 ? 'arch' : roll < 0.7 ? 'monoliths' : 'balloons';
    else if (biome === 3) type = roll < 0.45 ? 'arch' : roll < 0.7 ? 'monoliths' : 'balloons';
    else type = roll < 0.25 ? 'arch' : roll < 0.6 ? 'monoliths' : 'balloons';
    const shapingRadius = type === 'lighthouse' ? 120 : type === 'monoliths' ? 95 : 0;
    const plateauHeight = type === 'monoliths' ? Math.max(groundHeight, 6) : type === 'lighthouse' ? 14 : groundHeight;
    return {
      id: `${cellX}:${cellZ}`,
      cellX,
      cellZ,
      type,
      x,
      z,
      biome,
      biomeKey: BIOMES[biome].key,
      groundHeight,
      plateauHeight,
      shapingRadius,
      rotation: hash2(cellX, cellZ, 105) * Math.PI * 2,
      variant: hash2(cellX, cellZ, 106),
    };
  }

  function shapeForSite(site, x, z, height) {
    if (!site || site.shapingRadius === 0) return height;
    const dx = x - site.x;
    const dz = z - site.z;
    const distance = Math.sqrt(dx * dx + dz * dz);
    if (distance >= site.shapingRadius) return height;
    if (site.type === 'lighthouse') {
      const t = 1 - smoothstep(0, site.shapingRadius, distance);
      const islandHeight = -8 + (site.plateauHeight + 8) * Math.min(1, Math.pow(t, 0.7) * 1.25);
      return Math.max(height, islandHeight);
    }
    const blend = 1 - smoothstep(site.shapingRadius * 0.42, site.shapingRadius, distance);
    return height + (site.plateauHeight - height) * blend;
  }

  /** Analytic terrain height at any world point (metres above sea level). */
  function heightAt(x, z) {
    const height = baseHeight(x, z, scratchClimate, scratchWeights);
    const site = landmarkSiteForCell(Math.floor(x / LANDMARK_CELL), Math.floor(z / LANDMARK_CELL));
    return shapeForSite(site, x, z, height);
  }

  /**
   * Height of the rendered LOD0 mesh at (x, z): heightAt sampled on the global
   * GRID_STEP lattice and interpolated across the same two triangles the mesh
   * uses. Quad (i, j) is split along the diagonal from (i+1, j) to (i, j+1):
   *   triangle A = [v(i,j), v(i,j+1), v(i+1,j)]      (fx + fz <= 1)
   *   triangle B = [v(i+1,j), v(i,j+1), v(i+1,j+1)]  (fx + fz >  1)
   */
  function groundHeight(x, z) {
    const gx = x / GRID_STEP;
    const gz = z / GRID_STEP;
    const i = Math.floor(gx);
    const j = Math.floor(gz);
    const fx = gx - i;
    const fz = gz - j;
    const h10 = heightAt((i + 1) * GRID_STEP, j * GRID_STEP);
    const h01 = heightAt(i * GRID_STEP, (j + 1) * GRID_STEP);
    if (fx + fz <= 1) {
      const h00 = heightAt(i * GRID_STEP, j * GRID_STEP);
      return h00 + (h10 - h00) * fx + (h01 - h00) * fz;
    }
    const h11 = heightAt((i + 1) * GRID_STEP, (j + 1) * GRID_STEP);
    return h11 + (h01 - h11) * (1 - fx) + (h10 - h11) * (1 - fz);
  }

  function dominantBiome(weights) {
    let best = 0;
    for (let index = 1; index < 5; index++) if (weights[index] > weights[best]) best = index;
    return best;
  }

  /** Biome information for a world point. */
  function biomeAt(x, z) {
    const info = climate(x, z, { temperature: 0, moisture: 0 });
    const weights = biomeWeights(info.temperature, info.moisture, new Float64Array(5));
    const index = dominantBiome(weights);
    return {
      index,
      key: BIOMES[index].key,
      name: BIOMES[index].name,
      weights: Array.from(weights),
      temperature: info.temperature,
      moisture: info.moisture,
    };
  }

  // ---- Surface colour ----------------------------------------------------------
  const PALETTES = PALETTES_SRGB.map((palette) => {
    const linear = new Float32Array(18);
    palette.forEach((hex, index) => hexToLinear(hex, linear, index * 3));
    return linear;
  });

  function forestNoise(x, z) { return fbm(x, z, 1 / 650, 3, 22); }
  function flowerFieldNoise(x, z) { return fbm(x, z, 1 / 420, 2, 23); }

  function paletteIndex(biome, x, z, height, slope, normalX, normalZ, faceHash, snowLine) {
    const nearShore = height < WATER_LEVEL + 2.2;
    switch (biome) {
      case 0:
        if (nearShore) return 2;
        if (slope > 0.62) return faceHash < 0.5 ? 0 : 1;
        if (height > snowLine) return slope > 0.42 ? 3 : faceHash < 0.12 ? 5 : 4;
        if (height > snowLine - 60) return faceHash < 0.5 ? 2 : 3;
        return faceHash < 0.5 ? 1 : 2;
      case 1:
        if (nearShore) return 3;
        if (slope > 0.6) return 4;
        if (height > snowLine) return 5;
        if (forestNoise(x, z) > 0.05) return faceHash < 0.55 ? 0 : 3;
        return faceHash < 0.45 ? 1 : faceHash < 0.8 ? 2 : 0;
      case 2: {
        if (slope > 0.5) return 3;
        if (height > 70 && slope < 0.2) return faceHash < 0.5 ? 4 : 3;
        if (height < 22) return 5;
        if (faceHash > 0.97) return 4;
        const leeFacing = normalX * DUNE_COS + normalZ * DUNE_SIN;
        if (leeFacing < -0.12) return 2;
        return faceHash < 0.6 ? 0 : 1;
      }
      case 3:
        if (height < WATER_LEVEL - 12) return 0;
        if (height < WATER_LEVEL - 0.3) return 1;
        if (height < WATER_LEVEL + 2.4) return 2;
        if (slope > 0.55) return 5;
        return faceHash < 0.55 ? 3 : 4;
      default:
        if (nearShore || slope > 0.5) return 2;
        if (flowerFieldNoise(x, z) > 0.18 && faceHash > 0.35) {
          return 3 + Math.floor(hash2(Math.floor(x / 60), Math.floor(z / 60), 7) * 3);
        }
        if (faceHash > 0.93) return 3 + (Math.floor(faceHash * 1000) % 3);
        return faceHash < 0.55 ? 0 : 1;
    }
  }

  const colorClimate = { temperature: 0, moisture: 0 };
  const colorWeights = new Float64Array(5);

  /**
   * Flat face colour (linear RGB) for a triangle whose centroid is (x, height, z).
   * slope = 1 - normalY (0 flat .. 1 vertical); normalX/normalZ = face normal.
   * faceHash = stable per-face random in [0, 1) (use hash2 of the face's lattice cell).
   */
  function faceColor(x, z, height, slope, normalX, normalZ, faceHash, out, offset) {
    climate(x, z, colorClimate);
    biomeWeights(colorClimate.temperature, colorClimate.moisture, colorWeights);
    const snowLine = 250 + 520 * colorClimate.temperature;
    let red = 0;
    let green = 0;
    let blue = 0;
    let total = 0;
    for (let biome = 0; biome < 5; biome++) {
      const weight = colorWeights[biome];
      if (weight < 0.02) continue;
      const index = paletteIndex(biome, x, z, height, slope, normalX, normalZ, faceHash, snowLine) * 3;
      const palette = PALETTES[biome];
      red += weight * palette[index];
      green += weight * palette[index + 1];
      blue += weight * palette[index + 2];
      total += weight;
    }
    const jitter = (0.94 + 0.12 * faceHash) / total;
    out[offset] = red * jitter;
    out[offset + 1] = green * jitter;
    out[offset + 2] = blue * jitter;
  }

  // ---- Vegetation scatter ------------------------------------------------------
  const SCATTER_CELL = 11;
  const SCATTER_STRIDE = 7;

  /**
   * Deterministic vegetation for chunk (chunkX, chunkZ). Returns a Float32Array
   * with SCATTER_STRIDE floats per instance:
   *   [localX, y, localZ, scale, rotationY, type, variant]
   * localX/localZ are relative to the chunk origin (chunkX*CHUNK_SIZE, chunkZ*CHUNK_SIZE);
   * y is world height of the LOD0 ground (groundHeight). density in [0, 1].
   */
  function scatterChunk(chunkX, chunkZ, density) {
    const cellsPerSide = Math.floor(CHUNK_SIZE / SCATTER_CELL);
    const originX = chunkX * CHUNK_SIZE;
    const originZ = chunkZ * CHUNK_SIZE;
    const values = [];
    const localClimate = { temperature: 0, moisture: 0 };
    const localWeights = new Float64Array(5);
    for (let cellI = 0; cellI < cellsPerSide; cellI++) {
      for (let cellJ = 0; cellJ < cellsPerSide; cellJ++) {
        const ix = chunkX * cellsPerSide + cellI;
        const iz = chunkZ * cellsPerSide + cellJ;
        if (hash2(ix, iz, 201) > density) continue;
        const localX = (cellI + 0.15 + 0.7 * hash2(ix, iz, 202)) * SCATTER_CELL;
        const localZ = (cellJ + 0.15 + 0.7 * hash2(ix, iz, 203)) * SCATTER_CELL;
        const x = originX + localX;
        const z = originZ + localZ;
        const height = heightAt(x, z);
        if (height < WATER_LEVEL + 0.9) continue;
        const slope = Math.min(1, Math.hypot(heightAt(x + 2, z) - height, heightAt(x, z + 2) - height) / 2);
        climate(x, z, localClimate);
        biomeWeights(localClimate.temperature, localClimate.moisture, localWeights);
        let roll = hash2(ix, iz, 204);
        let biome = 4;
        for (let index = 0; index < 5; index++) {
          roll -= localWeights[index];
          if (roll <= 0) { biome = index; break; }
        }
        const snowLine = 250 + 520 * localClimate.temperature;
        const pick = hash2(ix, iz, 205);
        const forest = forestNoise(x, z);
        let type = -1;
        if (slope > 0.75) {
          if (pick < 0.05) type = VEGETATION.ROCK;
        } else if (biome === 0) {
          if (height > snowLine - 40) { if (pick < 0.06) type = VEGETATION.ROCK; }
          else if (forest > -0.1 && pick < 0.55) type = VEGETATION.PINE;
          else if (pick < 0.08) type = VEGETATION.ROCK;
        } else if (biome === 1) {
          if (height > snowLine) { if (pick < 0.05) type = VEGETATION.ROCK; }
          else if (slope > 0.6) { if (pick < 0.12) type = VEGETATION.ROCK; }
          else if (forest > -0.15) { if (pick < 0.85) type = VEGETATION.PINE; }
          else if (pick < 0.12) type = VEGETATION.BROADLEAF;
          else if (pick < 0.17) type = VEGETATION.ROCK;
        } else if (biome === 2) {
          if (slope > 0.45) { if (pick < 0.08) type = VEGETATION.ROCK; }
          else if (pick < 0.07) type = VEGETATION.CACTUS;
          else if (pick < 0.09) type = VEGETATION.ROCK;
        } else if (biome === 3) {
          if (height < WATER_LEVEL + 7) { if (pick < 0.32) type = VEGETATION.PALM; }
          else if (slope > 0.55) { if (pick < 0.1) type = VEGETATION.ROCK; }
          else if (pick < 0.6) type = pick < 0.18 ? VEGETATION.PALM : VEGETATION.BROADLEAF;
        } else {
          if (forest > 0.35 && pick < 0.6) type = VEGETATION.BROADLEAF;
          else if (flowerFieldNoise(x, z) > 0.1 && pick < 0.3) type = VEGETATION.FLOWERS;
          else if (pick < 0.05) type = VEGETATION.FLOWERS;
          else if (pick < 0.075) type = VEGETATION.BROADLEAF;
          else if (pick < 0.09) type = VEGETATION.ROCK;
        }
        if (type < 0) continue;
        const sizeRoll = hash2(ix, iz, 206);
        const scale = type === VEGETATION.PINE ? 0.75 + 0.7 * sizeRoll
          : type === VEGETATION.ROCK ? 0.5 + 1.4 * sizeRoll * sizeRoll
          : type === VEGETATION.FLOWERS ? 0.7 + 0.6 * sizeRoll
          : 0.7 + 0.6 * sizeRoll;
        values.push(localX, groundHeight(x, z), localZ, scale, hash2(ix, iz, 207) * Math.PI * 2, type, hash2(ix, iz, 208));
      }
    }
    return new Float32Array(values);
  }

  // ---- Landmark queries ---------------------------------------------------------
  /** All landmark sites whose cell overlaps the circle (x, z, radius). */
  function landmarkSitesNear(x, z, radius) {
    const minCellX = Math.floor((x - radius) / LANDMARK_CELL);
    const maxCellX = Math.floor((x + radius) / LANDMARK_CELL);
    const minCellZ = Math.floor((z - radius) / LANDMARK_CELL);
    const maxCellZ = Math.floor((z + radius) / LANDMARK_CELL);
    const sites = [];
    for (let cellX = minCellX; cellX <= maxCellX; cellX++) {
      for (let cellZ = minCellZ; cellZ <= maxCellZ; cellZ++) {
        const site = landmarkSiteForCell(cellX, cellZ);
        if (site && Math.hypot(site.x - x, site.z - z) <= radius) sites.push(site);
      }
    }
    return sites;
  }

  // ---- Search helpers (copilot "find ...") ------------------------------------------
  /**
   * Nearest point to (x, z) matching target, searching outward in rings.
   * target: 'snow' | 'pine' | 'dunes' | 'archipelago' | 'meadows' | 'ocean' | 'mountains'
   * Returns { x, z, distance } or null if nothing within maxRadius.
   */
  function findNearest(x, z, target, maxRadius) {
    const limit = maxRadius || 24000;
    const probeClimate = { temperature: 0, moisture: 0 };
    const probeWeights = new Float64Array(5);
    const biomeTarget = target === 'mountains' ? 0 : target === 'ocean' ? 3 : BIOMES.findIndex((biome) => biome.key === target);
    if (biomeTarget < 0) return null;
    for (let radius = 250; radius <= limit; radius += 300) {
      const samples = Math.max(12, Math.ceil((2 * Math.PI * radius) / 300));
      const phase = hash2(Math.floor(radius), 0, 301) * Math.PI * 2;
      for (let sample = 0; sample < samples; sample++) {
        const angle = phase + (sample / samples) * Math.PI * 2;
        const px = x + Math.sin(angle) * radius;
        const pz = z - Math.cos(angle) * radius;
        climate(px, pz, probeClimate);
        biomeWeights(probeClimate.temperature, probeClimate.moisture, probeWeights);
        if (probeWeights[biomeTarget] < 0.6) continue;
        if (target === 'ocean' && heightAt(px, pz) > WATER_LEVEL - 6) continue;
        if (target === 'mountains' && heightAt(px, pz) < 320) continue;
        return { x: px, z: pz, distance: radius };
      }
    }
    return null;
  }

  return {
    seed: String(seedString).toUpperCase(),
    seedHash,
    BIOMES,
    PALETTES_SRGB,
    VEGETATION,
    LANDMARK_TYPES,
    SCATTER_STRIDE,
    GRID_STEP,
    WATER_LEVEL,
    CHUNK_SIZE,
    LANDMARK_CELL,
    hash2,
    noise,
    fbm,
    climate,
    biomeWeights,
    heightAt,
    groundHeight,
    biomeAt,
    faceColor,
    forestNoise,
    scatterChunk,
    landmarkSiteForCell,
    landmarkSitesNear,
    findNearest,
  };
}

// SHARED UTILITIES

const MathUtils = THREE.MathUtils;
const DEG = Math.PI / 180;

function clamp(value, min, max) { return value < min ? min : value > max ? max : value; }
function damp(current, target, lambda, dt) { return MathUtils.damp(current, target, lambda, dt); }
function wrapDegrees(degrees) { return ((degrees % 360) + 360) % 360; }
/** Compass heading in degrees (0 = north = -z, 90 = east = +x) of a direction vector. */
function headingFromVector(x, z) { return wrapDegrees(Math.atan2(x, -z) / DEG); }
/** Unit horizontal direction for a compass heading in degrees. */
function vectorFromHeading(headingDegrees, target = new THREE.Vector3()) {
  const radians = headingDegrees * DEG;
  return target.set(Math.sin(radians), 0, -Math.cos(radians));
}
function bearingTo(fromX, fromZ, toX, toZ) { return headingFromVector(toX - fromX, toZ - fromZ); }
function compassName(headingDegrees) {
  const names = ['north', 'north-east', 'east', 'south-east', 'south', 'south-west', 'west', 'north-west'];
  return names[Math.round(wrapDegrees(headingDegrees) / 45) % 8];
}
function isFiniteVector(vector) { return Number.isFinite(vector.x) && Number.isFinite(vector.y) && Number.isFinite(vector.z); }
function isFiniteQuaternion(q) {
  return Number.isFinite(q.x) && Number.isFinite(q.y) && Number.isFinite(q.z) && Number.isFinite(q.w) && Math.abs(q.lengthSq() - 1) < 0.1;
}

class EventBus {
  constructor() { this.listeners = new Map(); }
  on(type, listener) {
    if (!this.listeners.has(type)) this.listeners.set(type, new Set());
    this.listeners.get(type).add(listener);
    return () => this.off(type, listener);
  }
  off(type, listener) { this.listeners.get(type)?.delete(listener); }
  emit(type, payload) {
    const listeners = this.listeners.get(type);
    if (!listeners) return;
    for (const listener of [...listeners]) {
      try {
        listener(payload);
      } catch (error) {
        console.error(`[DRIFTWING] listener for "${type}" failed`, error);
      }
    }
  }
}

// ---- Persistent storage (localStorage can throw in private modes) -------------
const storage = {
  available: true,
  read(key, fallback) {
    try {
      const raw = window.localStorage.getItem(key);
      return raw === null ? fallback : JSON.parse(raw);
    } catch (error) {
      storage.available = false;
      return fallback;
    }
  },
  write(key, value) {
    try {
      window.localStorage.setItem(key, JSON.stringify(value));
      return true;
    } catch (error) {
      storage.available = false;
      return false;
    }
  },
};

const DEFAULT_SETTINGS = Object.freeze({
  dayLength: CONFIG.DAY_LENGTH_DEFAULT,
  timeFrozen: false,
  quality: 'auto',
  mouseSensitivity: 1,
  invertPitch: false,
  copilotVoice: true,
  copilotChatter: true,
  remoteCopilot: false,
  remoteEndpoint: CONFIG.REMOTE_COPILOT_DEFAULT_ENDPOINT,
  masterVolume: 0.7,
  showFps: false,
  hudAutoHide: true,
});

function createSettings(bus) {
  const STORAGE_KEY = 'driftwing.settings.v1';
  const stored = storage.read(STORAGE_KEY, {});
  const values = { ...DEFAULT_SETTINGS };
  for (const key of Object.keys(DEFAULT_SETTINGS)) {
    if (stored && typeof stored[key] === typeof DEFAULT_SETTINGS[key]) values[key] = stored[key];
  }
  return {
    get(key) { return values[key]; },
    all() { return { ...values }; },
    set(key, value) {
      if (!(key in DEFAULT_SETTINGS) || typeof value !== typeof DEFAULT_SETTINGS[key]) return false;
      if (values[key] === value) return true;
      values[key] = value;
      storage.write(STORAGE_KEY, values);
      bus.emit('settings:changed', { key, value, settings: { ...values } });
      return true;
    },
  };
}

function resolveSeed(params) {
  const requested = params.get('seed');
  if (requested && /^[A-Za-z0-9-]{1,24}$/.test(requested)) return requested.toUpperCase();
  const alphabet = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  const bytes = new Uint8Array(6);
  crypto.getRandomValues(bytes);
  return Array.from(bytes, (byte) => alphabet[byte % alphabet.length]).join('');
}

// ---- Sun path -------------------------------------------------------------------
// dayTime in [0, 1): 0 midnight, 0.25 sunrise (east), 0.5 noon (south), 0.75 sunset (west).
function sunDirectionForDayTime(dayTime, target = new THREE.Vector3()) {
  const angle = (dayTime - 0.25) * Math.PI * 2;
  const elevation = Math.sin(angle) * CONFIG.SUN_MAX_ELEVATION_DEG * DEG;
  const azimuth = Math.PI / 2 + angle;
  return target.set(Math.sin(azimuth) * Math.cos(elevation), Math.sin(elevation), -Math.cos(azimuth) * Math.cos(elevation));
}
function moonDirectionForDayTime(dayTime, target = new THREE.Vector3()) {
  sunDirectionForDayTime((dayTime + 0.5) % 1, target);
  target.y = target.y * 0.85 + 0.12;
  return target.normalize();
}
/** dayTime at which the sun sits at elevationDegrees (evening side when evening = true). */
function dayTimeForSunElevation(elevationDegrees, evening) {
  const ratio = clamp(elevationDegrees / CONFIG.SUN_MAX_ELEVATION_DEG, -1, 1);
  const angle = Math.asin(ratio);
  const phase = evening ? Math.PI - angle : angle;
  return (((0.25 + phase / (Math.PI * 2)) % 1) + 1) % 1;
}

// ---- Spawn selection: deterministic "screenshot moment" near the origin ---------
function findSpawn(world, sunDirection) {
  const sunHeading = headingFromVector(sunDirection.x, sunDirection.z);
  let best = null;
  for (let ring = 0; ring < 12; ring++) {
    const samples = ring === 0 ? 1 : 6 + ring * 3;
    for (let sample = 0; sample < samples; sample++) {
      const angle = (sample / samples) * Math.PI * 2 + ring * 0.7;
      const x = Math.cos(angle) * ring * 450;
      const z = Math.sin(angle) * ring * 450;
      const here = world.heightAt(x, z);
      let min = here;
      let max = here;
      let land = here > 4 ? 1 : 0;
      for (let probe = 0; probe < 8; probe++) {
        const probeAngle = (probe / 8) * Math.PI * 2;
        const height = world.heightAt(x + Math.cos(probeAngle) * 750, z + Math.sin(probeAngle) * 750);
        min = Math.min(min, height);
        max = Math.max(max, height);
        if (height > 4) land++;
      }
      const relief = Math.min(max - min, 520);
      const score = relief * 0.6 + land * 22 - ring * 18 + (here > -10 ? 40 : -120);
      if (!best || score > best.score) best = { x, z, score };
    }
  }
  let bestHeading = wrapDegrees(sunHeading - 40);
  let bestHeadingScore = -Infinity;
  for (const offset of [-55, -40, -28, 28, 40, 55]) {
    const heading = wrapDegrees(sunHeading + offset);
    const forward = vectorFromHeading(heading);
    let score = 0;
    for (let step = 1; step <= 6; step++) {
      const height = world.heightAt(best.x + forward.x * step * 320, best.z + forward.z * step * 320);
      score += Math.min(height, 600) * 0.2 + (height > 4 ? 30 : 0);
    }
    if (score > bestHeadingScore) {
      bestHeadingScore = score;
      bestHeading = heading;
    }
  }
  const forward = vectorFromHeading(bestHeading);
  let clearance = world.heightAt(best.x, best.z);
  for (let step = 1; step <= 16; step++) {
    clearance = Math.max(clearance, world.heightAt(best.x + forward.x * step * 110, best.z + forward.z * step * 110));
  }
  const y = Math.max(clearance + 150, CONFIG.WATER_LEVEL + 190);
  return { x: best.x, y, z: best.z, heading: bestHeading };
}

/**
 * TERRAIN (stub). Real module: worker-generated chunked LOD terrain, skirts,
 * pooled meshes, instanced vegetation. API contract: see CONTRACT.md.
 */
function createTerrainSystem(ctx) {
  const { THREE: T, scene, world, state } = ctx;
  const size = 2400;
  const segments = 96;
  const geometry = new T.PlaneGeometry(size, size, segments, segments);
  geometry.rotateX(-Math.PI / 2);
  const material = new T.MeshStandardNodeMaterial({ color: 0x7f9a4e, roughness: 0.95, flatShading: true });
  const mesh = new T.Mesh(geometry, material);
  mesh.receiveShadow = true;
  scene.add(mesh);
  let centerX = NaN;
  let centerZ = NaN;
  function rebuild(x, z) {
    centerX = Math.round(x / 200) * 200;
    centerZ = Math.round(z / 200) * 200;
    mesh.position.set(centerX, 0, centerZ);
    const positions = geometry.attributes.position;
    for (let index = 0; index < positions.count; index++) {
      positions.setY(index, world.heightAt(centerX + positions.getX(index), centerZ + positions.getZ(index)));
    }
    positions.needsUpdate = true;
    geometry.computeVertexNormals();
    geometry.computeBoundingSphere();
  }
  rebuild(state.player.position.x, state.player.position.z);
  return {
    update() {
      const { x, z } = state.player.position;
      if (Math.abs(x - centerX) > 500 || Math.abs(z - centerZ) > 500) rebuild(x, z);
    },
    isReadyAround() { return true; },
    getStats() { return { chunks: 1, pending: 0, workers: 0 }; },
    dispose() { scene.remove(mesh); geometry.dispose(); material.dispose(); },
  };
}

/** SKY / ATMOSPHERE (stub). Real module: day-night cycle, sky dome, lights, fog. */
function createSkySystem(ctx) {
  const { THREE: T, scene, state, uniforms, settings, bus } = ctx;
  scene.background = new T.Color(0xe9b98a);
  const sun = new T.DirectionalLight(0xffd6a0, 3);
  sun.castShadow = false;
  scene.add(sun, sun.target);
  const hemisphere = new T.HemisphereLight(0xbfd4ff, 0x5a4a3a, 0.8);
  scene.add(hemisphere);
  let dayTime = state.time.dayTime;
  function apply() {
    state.time.dayTime = dayTime;
    sunDirectionForDayTime(dayTime, state.time.sunDirection);
    uniforms.sunDirection.value.copy(state.time.sunDirection);
    state.time.sunElevation = Math.asin(clamp(state.time.sunDirection.y, -1, 1)) / DEG;
    state.time.nightFactor = clamp(-state.time.sunElevation / 8, 0, 1);
    uniforms.nightFactor.value = state.time.nightFactor;
    sun.position.copy(state.player.position).addScaledVector(state.time.sunDirection, 800);
    sun.target.position.copy(state.player.position);
  }
  apply();
  return {
    sunLight: sun,
    update(dt) {
      if (!settings.get('timeFrozen')) dayTime = (dayTime + dt / settings.get('dayLength')) % 1;
      apply();
    },
    setDayTime(value) { dayTime = ((value % 1) + 1) % 1; apply(); bus.emit('time:changed', { dayTime, label: this.getTimeLabel() }); },
    getDayTime() { return dayTime; },
    getTimeLabel() { return state.time.nightFactor > 0.5 ? 'night' : 'day'; },
    getSunElevation() { return state.time.sunElevation; },
  };
}

      input.roll = (keys.has('KeyD') || keys.has('ArrowRight') ? 1 : 0) - (keys.has('KeyA') || keys.has('ArrowLeft') ? 1 : 0);
      input.yaw = 0;
      input.throttleDelta = (keys.has('KeyW') ? 1 : 0) - (keys.has('KeyS') ? 1 : 0);
    },
  };
}

/** FLIGHT (stub). Real module: arcade flight model, glider mesh, autopilot. */
function createFlightSystem(ctx) {
  const { THREE: T, scene, state, input, bus } = ctx;
  const player = state.player;
  const mesh = new T.Mesh(new T.BoxGeometry(12, 0.6, 3), new T.MeshStandardNodeMaterial({ color: 0xf1e4cf }));
  mesh.castShadow = true;
  scene.add(mesh);
  const euler = new T.Euler(0, 0, 0, 'YXZ');
  return {
    planeMesh: mesh,
    update(dt) {
      if (dt <= 0) return;
      player.throttle = clamp(player.throttle + input.throttleDelta * dt * 0.5, 0, 1);
      euler.setFromQuaternion(player.quaternion, 'YXZ');
      euler.x = clamp(euler.x - input.pitch * dt * 0.8, -0.8, 0.8);

      player.quaternion.setFromEuler(euler);
      player.speed = damp(player.speed, 40 + player.throttle * 60, 0.5, dt);
      player.forward.set(0, 0, -1).applyQuaternion(player.quaternion);
      player.velocity.copy(player.forward).multiplyScalar(player.speed);
      player.position.addScaledVector(player.velocity, dt);
      mesh.position.copy(player.position);
      mesh.quaternion.copy(player.quaternion);

    setAutopilot(options) { Object.assign(player.autopilot, options); bus.emit('autopilot:changed', { ...player.autopilot }); },
    barrelRoll() {},
    boost() {},
    getWingtips() { return [mesh.position.clone(), mesh.position.clone()]; },

// ============================================================================
// POST-PROCESSING: bloom + warm grade + vignette + grain (degrades to direct).
// ============================================================================
// Everything in outputNode is linear HDR; RenderPipeline applies ACES tone
// mapping + sRGB afterwards (outputColorTransform = true).
function createPostStack(renderer, scene, camera, uniforms) {
  const { pass, uniform, uv, vec2, vec3, vec4, float, smoothstep, mix, luminance, saturation, rand, fract } = TSL;
  const controls = {
    vignette: uniform(0.4),
    grain: uniform(0.028),
    saturation: uniform(1.06),
    warmth: uniform(1),
    exposure: uniform(1),
  };
  const pipeline = new THREE.RenderPipeline(renderer);
  const scenePass = pass(scene, camera);
  const sceneColor = scenePass.getTextureNode('output');
  const bloomNode = bloom(sceneColor, 0.3, 0.5, 0.9);

  function grade(hdr) {
    const luma = luminance(hdr);
    const warmTint = mix(vec3(1, 1, 1), vec3(1.05, 1.0, 0.9), controls.warmth);
    const coolShadows = mix(vec3(0.92, 0.97, 1.07), vec3(1, 1, 1), smoothstep(float(0.0), float(0.3), luma));
    let color = saturation(hdr.mul(controls.exposure), controls.saturation).mul(warmTint).mul(coolShadows);
    const edge = uv().sub(vec2(0.5, 0.5)).mul(vec2(1.0, 0.8)).length();
    color = color.mul(float(1).sub(smoothstep(float(0.3), float(0.85), edge).mul(controls.vignette)));
    const grain = rand(uv().add(fract(uniforms.time.mul(0.713)))).sub(0.5).mul(controls.grain);
    return vec4(color.add(grain.mul(luminance(color).add(0.06))), 1);
  }
  const outputWithBloom = grade(sceneColor.rgb.add(bloomNode.rgb));
  const outputWithoutBloom = grade(sceneColor.rgb);
  let bloomEnabled = true;
  pipeline.outputNode = outputWithBloom;
  return {
    pipeline,
    controls,
    bloomNode,
    setBloomEnabled(enabled) {
      if (bloomEnabled === enabled) return;
      bloomEnabled = enabled;
      pipeline.outputNode = enabled ? outputWithBloom : outputWithoutBloom;
      pipeline.needsUpdate = true;
    },
  };
}

// ============================================================================
// PERFORMANCE GOVERNOR: steps quality down before frame drops, back up slowly.
// ============================================================================
function createPerfGovernor(ctx) {
  const { renderer, settings, bus, state } = ctx;
  const levels = CONFIG.QUALITY_LEVELS;
  const fixedIndex = { minimal: 0, low: 1, medium: 2, high: 3, ultra: 4 };
  let levelIndex = 3;
  let emaMs = 16.7;
  let slowSeconds = 0;
  let fastSeconds = 0;
  let cooldown = 3;
  const blockedUntil = new Array(levels.length).fill(0);

  function apply(index, reason) {
    levelIndex = clamp(index, 0, levels.length - 1);
    const level = levels[levelIndex];
    Object.assign(ctx.quality, level, { levelIndex, auto: settings.get('quality') === 'auto' });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, level.pixelRatio));
    bus.emit('quality:changed', { ...ctx.quality, reason });
  }
  function fromSettings() {
    const preference = settings.get('quality');
    apply(preference in fixedIndex ? fixedIndex[preference] : 3, 'settings');
  }
  bus.on('settings:changed', ({ key }) => { if (key === 'quality') fromSettings(); });
  fromSettings();

  return {
    update(realDt) {
      const ms = realDt * 1000;
      emaMs += (ms - emaMs) * 0.08;
      state.perf.fps = 1000 / emaMs;
      state.perf.frameMs = emaMs;
      if (settings.get('quality') !== 'auto' || state.photoMode) return;
      cooldown -= realDt;
      if (emaMs > 18.2) { slowSeconds += realDt; fastSeconds = 0; }
      else if (emaMs < 16.95) { fastSeconds += realDt; slowSeconds = 0; }
      else { slowSeconds = 0; fastSeconds = 0; }
      if (cooldown > 0) return;
      if (slowSeconds > 1.2 && levelIndex > 0) {
        blockedUntil[levelIndex] = state.time.realElapsed + 30;
        apply(levelIndex - 1, 'auto-degrade');
        cooldown = 4;
        slowSeconds = 0;
      } else if (fastSeconds > 8 && levelIndex < 3 && state.time.realElapsed > blockedUntil[levelIndex + 1]) {
        apply(levelIndex + 1, 'auto-upgrade');
        cooldown = 6;
        fastSeconds = 0;
      }
    },
  };
}

// ============================================================================
// BOOT
// ============================================================================
async function boot() {
  const params = new URLSearchParams(window.location.search);
  const bus = new EventBus();
  const settings = createSettings(bus);
  const seed = resolveSeed(params);
  if (params.get('seed') !== seed) {
    params.set('seed', seed);
    window.history.replaceState(null, '', `${window.location.pathname}?${params.toString()}${window.location.hash}`);
  }

  // ---- Renderer: WebGPU first, WebGL2 fallback ---------------------------------
  let webgpuAvailable = false;
  if (params.get('renderer') !== 'webgl' && navigator.gpu) {
    try {
      webgpuAvailable = (await navigator.gpu.requestAdapter({ featureLevel: 'compatibility' })) !== null;
    } catch (error) {
      webgpuAvailable = false;
    }
  }
  // Reversed depth only on WebGPU: on WebGL2 it needs EXT_clip_control (warns otherwise).
  const renderer = new THREE.WebGPURenderer({ antialias: true, forceWebGL: !webgpuAvailable, reversedDepthBuffer: webgpuAvailable });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.0;
  renderer.shadowMap.enabled = true;
  renderer.domElement.id = 'view';
  renderer.domElement.setAttribute('tabindex', '0');
  renderer.domElement.setAttribute('aria-label', 'DRIFTWING flight view');
  renderer.domElement.addEventListener('contextmenu', (event) => event.preventDefault());
  document.body.prepend(renderer.domElement);
  await renderer.init();
  const backend = renderer.backend.isWebGPUBackend ? 'WebGPU' : 'WebGL2';
  console.info(`[DRIFTWING] backend=${backend} three r${THREE.REVISION} seed=${seed}`);

  // ---- Scene, camera, shared uniforms ----------------------------------------------
  const scene = new THREE.Scene();
  scene.fog = new THREE.Fog(0xe0b48c, 400, 2400);
  const camera = new THREE.PerspectiveCamera(CONFIG.CAMERA.FOV_BASE, window.innerWidth / window.innerHeight, CONFIG.CAMERA.NEAR, 9000);
  scene.add(camera);

  const cloudShadowData = new Uint8Array(CONFIG.CLOUD_SHADOW.SIZE * CONFIG.CLOUD_SHADOW.SIZE * 4);
  const cloudShadowTexture = new THREE.DataTexture(cloudShadowData, CONFIG.CLOUD_SHADOW.SIZE, CONFIG.CLOUD_SHADOW.SIZE, THREE.RGBAFormat, THREE.UnsignedByteType);
  cloudShadowTexture.magFilter = THREE.LinearFilter;
  cloudShadowTexture.minFilter = THREE.LinearFilter;
  cloudShadowTexture.wrapS = THREE.ClampToEdgeWrapping;
  cloudShadowTexture.wrapT = THREE.ClampToEdgeWrapping;
  cloudShadowTexture.generateMipmaps = false;
  cloudShadowTexture.needsUpdate = true;

  const { uniform } = TSL;
  const uniforms = {
    time: uniform(0),
    sunDirection: uniform(new THREE.Vector3(0, 1, 0)),
    sunColor: uniform(new THREE.Color(1, 0.85, 0.65)),
    moonDirection: uniform(new THREE.Vector3(0, -1, 0)),
    fogColor: uniform(new THREE.Color(0xe0b48c)),
    skyHorizonColor: uniform(new THREE.Color(0xf2c48e)),
    skyZenithColor: uniform(new THREE.Color(0x4f6fa8)),
    nightFactor: uniform(0),
    goldenFactor: uniform(1),
    cloudShadowCenter: uniform(new THREE.Vector2(0, 0)),
    cloudShadowWorldSize: uniform(CONFIG.CLOUD_SHADOW.WORLD),
    windDirection: uniform(new THREE.Vector2(0.8, 0.6).normalize()),
    windStrength: uniform(1),
    playerPosition: uniform(new THREE.Vector3()),
    waterLevel: uniform(CONFIG.WATER_LEVEL),
  };

  // ---- World + spawn ------------------------------------------------------------------
  const world = createWorldGen(seed, WORLD_OPTIONS);
  const requestedTime = Number.parseFloat(params.get('time'));
  const startDayTime = Number.isFinite(requestedTime)
    ? ((requestedTime % 1) + 1) % 1
    : dayTimeForSunElevation(CONFIG.START_SUN_ELEVATION_DEG, true);
  const startSun = sunDirectionForDayTime(startDayTime);
  const spawn = findSpawn(world, startSun);

  // ---- Shared game state ----------------------------------------------------------------
  const state = {
    frame: 0,
    ready: false,
    paused: false,
    photoMode: false,
    seed,
    spawn,
    time: {
      elapsed: 0,
      realElapsed: 0,
      dayTime: startDayTime,
      sunDirection: startSun.clone(),
      moonDirection: moonDirectionForDayTime(startDayTime),
      sunElevation: Math.asin(startSun.y) / DEG,
      nightFactor: 0,
      goldenFactor: 1,
      label: 'golden hour',
    },
    player: {
      position: new THREE.Vector3(spawn.x, spawn.y, spawn.z),
      velocity: vectorFromHeading(spawn.heading).multiplyScalar(CONFIG.SPEED.CRUISE),
      quaternion: new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), -spawn.heading * DEG),
      forward: vectorFromHeading(spawn.heading),
      up: new THREE.Vector3(0, 1, 0),
      right: new THREE.Vector3(),
      speed: CONFIG.SPEED.CRUISE,
      throttle: 0.55,
      heading: spawn.heading,
      pitch: 0,
      roll: 0,
      yawRate: 0,
      verticalSpeed: 0,
      gForce: 1,
      altitude: spawn.y,
      groundHeight: world.groundHeight(spawn.x, spawn.z),
      agl: spawn.y - world.groundHeight(spawn.x, spawn.z),
      stalled: false,
      boost: { active: false, remaining: 0, cooldown: 0, cooldownTotal: 6 },
      barrelRoll: { active: false, direction: 0, progress: 0 },
      autopilot: { enabled: false, heading: spawn.heading, altitude: spawn.y, followWaypoint: false },
      biome: world.biomeAt(spawn.x, spawn.z),
    },
    waypoint: null,
    ringCourse: { active: false, total: 0, passed: 0, streak: 0, bestStreak: 0, elapsed: 0, nextIndex: 0 },
    perf: { fps: 60, frameMs: 16.7 },
  };
  state.player.right.set(1, 0, 0).applyQuaternion(state.player.quaternion);

  const input = {
    pitch: 0,
    roll: 0,
    yaw: 0,
    throttleDelta: 0,
    throttleTarget: null,
    boost: false,
    fineControl: false,
    mouseActive: false,
    lastActivity: 0,
    touch: { active: false, x: 0, y: 0, throttle: null, boost: false },
  };

  const ctx = {
    THREE,
    TSL,
    addons: { BufferGeometryUtils },
    CONFIG,
    renderer,
    backend,
    scene,
    camera,
    bus,
    settings,
    world,
    worldSource: WORLDGEN_WORKER_SOURCE,
    worldOptions: WORLD_OPTIONS,
    state,
    input,
    uniforms,
    textures: { cloudShadow: cloudShadowTexture },
    quality: {},
    systems: {},
    util: {
      clamp, damp, wrapDegrees, headingFromVector, vectorFromHeading, bearingTo, compassName,
      sunDirectionForDayTime, moonDirectionForDayTime, dayTimeForSunElevation,
    },
    executeAction: () => {},
    getFlightState: null,
    setPhotoMode: null,
    requestScreenshot: null,
    userHasInteracted: false,
  };

  // ---- First user gesture: unlocks audio + speech synthesis ---------------------------
  const onFirstGesture = () => {
    if (ctx.userHasInteracted) return;
    ctx.userHasInteracted = true;
    bus.emit('user:gesture', {});
    window.removeEventListener('pointerdown', onFirstGesture, true);
    window.removeEventListener('keydown', onFirstGesture, true);
    window.removeEventListener('touchstart', onFirstGesture, true);
  };
  window.addEventListener('pointerdown', onFirstGesture, true);
  window.addEventListener('keydown', onFirstGesture, true);
  window.addEventListener('touchstart', onFirstGesture, true);

  const perf = createPerfGovernor(ctx);

  // ---- Systems (creation order matters for cross-references at construction) --------
  const factories = [
    ['audio', createAudioSystem],
    ['ui', createUISystem],
    ['input', createInputSystem],
    ['sky', createSkySystem],
    ['terrain', createTerrainSystem],
    ['water', createWaterSystem],
    ['clouds', createCloudSystem],
    ['birds', createBirdSystem],
    ['journal', createJournal],
    ['landmarks', createLandmarkSystem],
    ['waypoints', createWaypointSystem],
    ['rings', createRingCourseSystem],
    ['flight', createFlightSystem],
    ['camera', createCameraRig],
    ['fx', createFxSystem],
    ['copilot', createCopilotSystem],
  ];
  for (const [name, factory] of factories) {
    try {
      ctx.systems[name] = factory(ctx);
    } catch (error) {
      console.error(`[DRIFTWING] system "${name}" failed to initialise`, error);
      ctx.systems[name] = { update() {}, failed: true };
    }
  }
  const UPDATE_ORDER = ['input', 'flight', 'camera', 'terrain', 'sky', 'water', 'clouds', 'birds', 'landmarks', 'journal', 'waypoints', 'rings', 'fx', 'copilot', 'audio', 'ui'];

  // ---- Flight-state snapshot for the copilot (local or remote brain) -----------------
  ctx.getFlightState = () => {
    const player = state.player;
    const waypoint = state.waypoint;
    const nearby = ctx.systems.landmarks.getNearby ? ctx.systems.landmarks.getNearby(6000) : [];
    const journal = ctx.systems.journal.getData ? ctx.systems.journal.getData() : null;
    return {
      seed,
      position: { x: Math.round(player.position.x), y: Math.round(player.position.y), z: Math.round(player.position.z) },
      altitude: Math.round(player.altitude),
      altitudeAboveGround: Math.round(player.agl),
      speed: Math.round(player.speed),
      speedKmh: Math.round(player.speed * 3.6),
      heading: Math.round(player.heading),
      headingName: compassName(player.heading),
      pitch: Math.round(player.pitch),
      roll: Math.round(player.roll),
      throttle: Math.round(player.throttle * 100) / 100,
      verticalSpeed: Math.round(player.verticalSpeed * 10) / 10,
      biome: { key: player.biome.key, name: player.biome.name },
      dayTime: Math.round(state.time.dayTime * 1000) / 1000,
      timeLabel: state.time.label,
      isNight: state.time.nightFactor > 0.5,
      autopilot: { ...player.autopilot },
      waypoint: waypoint
        ? {
            x: Math.round(waypoint.x),
            z: Math.round(waypoint.z),
            label: waypoint.label,
            distance: Math.round(Math.hypot(waypoint.x - player.position.x, waypoint.z - player.position.z)),
            bearing: Math.round(bearingTo(player.position.x, player.position.z, waypoint.x, waypoint.z)),
          }
        : null,
      ringCourse: { ...state.ringCourse },
      nearbyLandmarks: nearby.slice(0, 5),
      journal,
    };
  };

  // ---- Photo mode + screenshot -----------------------------------------------------------
  ctx.setPhotoMode = (active) => {
    const next = Boolean(active);
    if (state.photoMode === next) return;
    state.photoMode = next;
    state.paused = next;
    ctx.systems.camera.setPhotoMode?.(next);
    ctx.systems.ui.setPhotoMode?.(next);
    bus.emit('photo:changed', { active: next });
  };
  // Capture must happen in the same tick as the single render (WebGL2 has no
  // preserveDrawingBuffer); the pixel ratio is raised BEFORE that render.
  let screenshotRequest = null;
  ctx.requestScreenshot = (options = {}) => { screenshotRequest = { scale: options.scale ?? 1.5 }; };
  function captureScreenshot() {
    renderer.domElement.toBlob((blob) => {
      if (!blob) {
        bus.emit('notify', { text: 'Screenshot failed on this browser.', kind: 'warning' });
        return;
      }
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = `driftwing-${seed}-${Date.now()}.png`;
      link.click();
      setTimeout(() => URL.revokeObjectURL(link.href), 4000);
      bus.emit('screenshot:taken', {});
    }, 'image/png');
  }

  // ---- Post stack --------------------------------------------------------------------------
  let post = null;
  try {
    post = createPostStack(renderer, scene, camera, uniforms);
    ctx.post = post;
    post.setBloomEnabled(ctx.quality.bloom !== false);
    bus.on('quality:changed', (quality) => post?.setBloomEnabled(quality.bloom !== false));
  } catch (error) {
    console.error('[DRIFTWING] post stack unavailable, rendering directly', error);
  }
  function render() {
    if (post) {
      try {
        post.pipeline.render();
        return;
      } catch (error) {
        console.error('[DRIFTWING] post stack failed, rendering directly', error);
        post = null;
      }
    }
    renderer.render(scene, camera);
  }

  // ---- Resize ----------------------------------------------------------------------------------
  function onResize() {
    const width = window.innerWidth;
    const height = window.innerHeight;
    camera.aspect = width / height;
    camera.updateProjectionMatrix();
    renderer.setSize(width, height);
    bus.emit('resize', { width, height });
  }
  window.addEventListener('resize', onResize);

  // ---- Safety net: NaN attitude, terrain clamp, altitude ceiling -------------------------
  const lastGood = { position: state.player.position.clone(), quaternion: state.player.quaternion.clone(), velocity: state.player.velocity.clone() };
  function enforceSafety() {
    const player = state.player;
    if (!isFiniteVector(player.position) || !isFiniteQuaternion(player.quaternion) || !isFiniteVector(player.velocity) || !Number.isFinite(player.speed)) {
      player.position.copy(lastGood.position);
      player.quaternion.copy(lastGood.quaternion);
      player.velocity.copy(lastGood.velocity);
      player.speed = Math.max(CONFIG.SPEED.STALL, lastGood.velocity.length());
    } else {
      player.quaternion.normalize();
    }
    const ground = world.groundHeight(player.position.x, player.position.z);
    const floor = Math.max(ground + CONFIG.GROUND_CLEARANCE, CONFIG.WATER_LEVEL + CONFIG.WATER_CLEARANCE);
    if (player.position.y < floor) {
      player.position.y = floor;
      if (player.velocity.y < 0) player.velocity.y = 0;
    }
    if (player.position.y > CONFIG.MAX_ALTITUDE) {
      player.position.y = CONFIG.MAX_ALTITUDE;
      if (player.velocity.y > 0) player.velocity.y = 0;
    }
    player.groundHeight = ground;
    player.altitude = player.position.y;
    player.agl = player.position.y - Math.max(ground, CONFIG.WATER_LEVEL);
    lastGood.position.copy(player.position);
    lastGood.quaternion.copy(player.quaternion);
    lastGood.velocity.copy(player.velocity);
  }

  // ---- Biome tracking ----------------------------------------------------------------------------
  let biomeTimer = 0;
  function trackBiome(dt) {
    biomeTimer -= dt;
    if (biomeTimer > 0) return;
    biomeTimer = 0.4;
    const info = world.biomeAt(state.player.position.x, state.player.position.z);
    const previous = state.player.biome;
    state.player.biome = info;
    if (!previous || previous.key !== info.key) bus.emit('biome:changed', { biome: info, previous });
  }

  // ---- Main loop --------------------------------------------------------------------------------------
  const disabledSystems = new Set();
  let lastTimeMs = null;
  document.addEventListener('visibilitychange', () => { lastTimeMs = null; });
  const fade = document.getElementById('fade');
  let fadeStarted = false;
  let warmupFrames = 0;

  function frame(timeMs) {
    let realDt = lastTimeMs === null ? 1 / 60 : (timeMs - lastTimeMs) / 1000;
    lastTimeMs = timeMs;
    if (!(realDt > 0) || realDt > 0.25) realDt = 1 / 60;
    realDt = Math.min(realDt, 1 / 20);
    const simDt = state.paused ? 0 : realDt;
    state.frame++;
    state.time.elapsed += simDt;
    state.time.realElapsed += realDt;
    uniforms.time.value = state.time.elapsed;
    uniforms.playerPosition.value.copy(state.player.position);

    const cpuStart = performance.now();
    for (const name of UPDATE_ORDER) {
      if (disabledSystems.has(name)) continue;
      try {
        ctx.systems[name].update(simDt, realDt);
      } catch (error) {
        disabledSystems.add(name);
        console.error(`[DRIFTWING] system "${name}" crashed and was disabled`, error);
      }
      if (name === 'flight') enforceSafety();
    }
    if (!state.paused) trackBiome(simDt);
    perf.update(realDt, performance.now() - cpuStart);
    const shot = screenshotRequest;
    screenshotRequest = null;
    let restorePixelRatio = 0;
    if (shot && shot.scale !== 1) {
      restorePixelRatio = renderer.getPixelRatio();
      renderer.setPixelRatio(Math.min(restorePixelRatio * shot.scale, 4096 / Math.max(1, window.innerWidth)));
    }
    render();
    if (shot) captureScreenshot();
    if (restorePixelRatio) renderer.setPixelRatio(restorePixelRatio);

    if (!fadeStarted) {
      warmupFrames++;
      const terrainReady = ctx.systems.terrain.isReadyAround ? ctx.systems.terrain.isReadyAround(state.player.position.x, state.player.position.z) : true;
      if ((terrainReady && warmupFrames > 3) || state.time.realElapsed > 6) {
        fadeStarted = true;
        state.ready = true;
        fade.classList.add('clear');
        bus.emit('game:ready', {});
      }
    }
    debugHandle.frame = state.frame;
  }

  const debugHandle = {
    ready: false,
    backend,
    revision: THREE.REVISION,
    seed,
    frame: 0,
    ctx,
    get state() { return state; },
    getStats() {
      const info = renderer.info;
      return {
        backend,
        revision: THREE.REVISION,
        seed,
        fps: Math.round(state.perf.fps),
        frameMs: Math.round(state.perf.frameMs * 10) / 10,
        drawCalls: info.render.drawCalls ?? info.render.calls,
        triangles: info.render.triangles,
        quality: ctx.quality.name,
        dayTime: Math.round(state.time.dayTime * 1000) / 1000,
        timeLabel: state.time.label,
        player: ctx.getFlightState(),
        terrain: ctx.systems.terrain.getStats ? ctx.systems.terrain.getStats() : null,
        clouds: ctx.systems.clouds.getStats ? ctx.systems.clouds.getStats() : null,
        birds: ctx.systems.birds.getStats ? ctx.systems.birds.getStats() : null,
        landmarks: ctx.systems.landmarks.getStats ? ctx.systems.landmarks.getStats() : null,
        disabledSystems: [...disabledSystems],
      };
    },
  };
  window.DRIFTWING = debugHandle;
  bus.on('game:ready', () => { debugHandle.ready = true; });

  renderer.setAnimationLoop(frame);
}

boot().catch((error) => {
  console.error('[DRIFTWING] boot failed', error);
  const panel = document.getElementById('boot-error');
  const message = document.getElementById('boot-error-message');
  message.textContent = `DRIFTWING could not start: ${error && error.message ? error.message : error}. Try a current version of Chrome, Edge or Safari.`;
  panel.hidden = false;
});
</script>
</body>
</html>
